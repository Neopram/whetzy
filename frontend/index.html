<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1CB0F6" />

    <!-- Declared directly here (not via CSS @import — see src/styles/global.css)
         so the browser's preload scanner discovers and fetches it immediately,
         in parallel with the rest of <head>, instead of only after the main
         CSS bundle has been fetched and parsed (task 11.11). Loaded async
         (the classic loadCSS `media="print"` swap) rather than as a plain
         render-blocking stylesheet: a cross-origin CSS request to
         fonts.googleapis.com still measurably delayed LCP even once
         discoverable immediately (Lighthouse's render-blocking-insight
         flagged ~600ms of estimated savings here). `font-display: swap` in
         Google's CSS means text already renders in the fallback font the
         instant it can and swaps to Nunito once it loads, so this only
         changes *when* the swap happens, not whether text is visible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" />
    </noscript>

    <title>Whetzy — Aprende lo que importa, cuando importa</title>
    <meta name="description" content="Whetzy adapta cada pregunta a tu nivel con IA, repaso espaciado y gamificación — de Python básico a AI Engineer, en español e inglés." />

    <!-- Static defaults for the marketing landing (Spanish). LandingScreen.tsx
         overrides these client-side for the ?lang=en variant via useDocumentMeta. -->
    <link rel="canonical" href="https://whetzy.com/landing" />
    <link rel="alternate" hreflang="es" href="https://whetzy.com/landing" />
    <link rel="alternate" hreflang="en" href="https://whetzy.com/landing?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://whetzy.com/landing" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Whetzy" />
    <meta property="og:url" content="https://whetzy.com/landing" />
    <meta property="og:title" content="Whetzy — Aprende lo que importa, cuando importa" />
    <meta property="og:description" content="Whetzy adapta cada pregunta a tu nivel con IA, repaso espaciado y gamificación — de Python básico a AI Engineer, en español e inglés." />
    <meta property="og:image" content="https://whetzy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Whetzy — aprende lo que importa / learn what matters" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whetzy — Aprende lo que importa, cuando importa" />
    <meta name="twitter:description" content="Whetzy adapta cada pregunta a tu nivel con IA, repaso espaciado y gamificación — de Python básico a AI Engineer, en español e inglés." />
    <meta name="twitter:image" content="https://whetzy.com/og-image.png" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
