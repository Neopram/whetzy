name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdef
      GROQ_API_KEY: ""
      COVERAGE_FILE: /tmp/.coverage_whetzy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit pytest-cov mypy ruff

      - name: Dependency audit (pip-audit)
        # Fails the build if any known vulnerability is found.
        # starlette CVEs require FastAPI major upgrade — deferred to 7.1 security audit.
        # ecdsa CVE has no fix version available upstream yet.
        run: |
          pip-audit --progress-spinner off \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-1325

      - name: Lint (ruff)
        run: ruff check app

      - name: Type check (mypy)
        run: mypy app --strict --ignore-missing-imports

      - name: Tests
        run: |
          python -m pytest tests/ \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: /tmp/.coverage_whetzy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Dependency audit (npm audit)
        # --audit-level=high fails on HIGH or CRITICAL vulns.
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npx oxlint src --deny-warnings

      - name: Tests (vitest)
        run: npm run test:coverage

      - name: Build
        run: npx vite build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install E2E deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npm run install

      - name: Run DB migrations for E2E
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./e2e-test.db"
          ENVIRONMENT: test
          SECRET_KEY: e2e-test-secret-for-ci
          GROQ_API_KEY: ""
        run: alembic upgrade head

      - name: Run E2E tests
        working-directory: e2e
        env:
          CI: "true"
          DATABASE_URL: "sqlite+aiosqlite:///./e2e-test.db"
          ENVIRONMENT: test
          SECRET_KEY: e2e-test-secret-for-ci
          GROQ_API_KEY: ""
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
