name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdef
      GROQ_API_KEY: ""
      COVERAGE_FILE: /tmp/.coverage_whetzy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit pytest-cov mypy

      - name: Dependency audit (pip-audit)
        # Fails the build on HIGH or CRITICAL vulnerabilities.
        # Add --ignore-vuln PYSEC-<id> for known-safe transitive issues only.
        run: pip-audit --strict --vulnerability-service pypi --fail-on HIGH

      - name: Lint (ruff)
        run: ruff check app

      - name: Type check (mypy)
        run: mypy app --strict --ignore-missing-imports

      - name: Tests
        run: |
          python -m pytest tests/ \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: /tmp/.coverage_whetzy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Dependency audit (npm audit)
        # --audit-level=high fails on HIGH or CRITICAL vulns.
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint (oxlint)
        run: npx oxlint src --deny-warnings

      - name: Build
        run: npx vite build
