name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdef
      GROQ_API_KEY: ""
      COVERAGE_FILE: /tmp/.coverage_whetzy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit pytest-cov mypy ruff

      - name: Dependency audit (pip-audit)
        # Fails the build if any known vulnerability is found.
        # starlette CVEs require FastAPI major upgrade — deferred to 7.1 security audit.
        # ecdsa CVE has no fix version available upstream yet.
        run: |
          pip-audit --progress-spinner off \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-1325

      # Runs from the repo root, not backend/: it validates content/, which is
      # shared. No network, so a docs-site outage cannot turn the build red -
      # the URL-fetching counterpart (scripts/check_content_sources.py) is
      # deliberately manual for that reason.
      - name: Question bank structure (10.3)
        working-directory: .
        run: python scripts/check_question_bank.py

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app --strict --ignore-missing-imports

      - name: Tests
        run: |
          python -m pytest tests/ \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: /tmp/.coverage_whetzy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Dependency audit (npm audit)
        # --audit-level=high fails on HIGH or CRITICAL vulns.
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npx oxlint src --deny-warnings

      - name: Tests (vitest)
        run: npm run test:coverage

      # `npm run build`, not `npx vite build`: the landing prerender (11.11) lives
      # in that script, and building without it silently skipped the prerender in
      # CI for as long as this step existed — see task 12.10.
      - name: Build
        run: npm run build

      - name: Landing prerender emitted (11.11 / 12.10)
        run: node scripts/check-prerender.mjs

      - name: Bundle size budget (8.3)
        run: node scripts/check-bundle.mjs

      - name: No third-party origins in the build (12.7, red line 5)
        run: node scripts/check-no-third-party.mjs

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whetzy
          POSTGRES_PASSWORD: whetzy
          POSTGRES_DB: whetzy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+asyncpg://whetzy:whetzy@localhost:5432/whetzy_e2e"
      ENVIRONMENT: test
      SECRET_KEY: e2e-test-secret-for-ci
      GROQ_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate + seed content
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.services.content_loader

      - name: Install frontend deps (incl. Playwright)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        # playwright.config.ts's webServer starts both the backend (uvicorn,
        # port 8000) and frontend (vite, port 5199) itself against this DB.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
