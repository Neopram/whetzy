# Actualizaciones de dependencias (ledger 22.4). Semanal y agrupado para no
# inundar de PRs; los PRs de Dependabot pasan por las mismas guardas que el resto
# y solo el dueño fusiona (ADR-45).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # Estos majors rompieron master el 2026-10-02 (sin CI que lo parase, H.13):
    # vite 8 exige @vitejs/plugin-react 6 y vitest 5; coverage-v8 5 exige vitest
    # 5 exacto; pyodide 314 cambia los ficheros que sirve el plugin de
    # autoalojamiento (vite.config.ts). Se suben a mano, juntos, en su propio PR.
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyodide"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
