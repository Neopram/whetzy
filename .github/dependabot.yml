# Actualizaciones de dependencias (ledger 22.4). Semanal y agrupado para no
# inundar de PRs; los PRs de Dependabot pasan por las mismas guardas que el resto
# y solo el dueño fusiona (ADR-45).
#
# Ningún major (2026-10-02). Con el CI sin runner (H.13), dos olas de majors
# llegaron el mismo día: bcrypt 5 tumbó la API, vite 8 / coverage-v8 5 / pyodide
# 314 rompieron el build y stripe 15 rompió los webhooks; en la segunda, typescript
# 7 no compila (`tsc -b` falla en usePushNotifications.ts y Cloudflare Pages no
# publica) y redis 8 deja un `type: ignore` sobrante que tumba mypy --strict.
# Un major es una migración: se hace a mano, en su PR, con la puerta local verde.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # pyodide va en 0.x: cada «minor» cambia la versión de Python de los
      # ejercicios (0.26 trae 3.12, 0.29 trae 3.13) y la lista de ficheros que
      # sirve vite.config.ts. Ninguna actualización automática.
      - dependency-name: "pyodide"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
