# Gitleaks config (ledger 22.4). Runs in pre-commit and ci_local.sh.
# Baselines false positives from i18n keys and test fixtures.
title = "whetzy gitleaks config"

[allowlist]
  paths = [
    '''frontend/dist/''',
    '''frontend/node_modules/''',
    '''corpus/''',
    '''.claude/worktrees/''',
    '''\.ci-local/''',
  ]
  regexTarget = "match"
  regexes = [
    # i18n translation keys (legal.privacyP3 etc.)
    '''i18nKey="[^"]*"''',
    # Test fixtures with fake keys/tokens
    '''test_.*\.py''',
  ]
