<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Primer plano del icono adaptativo de Android (108 dp): transparente, con
       el símbolo dentro del círculo seguro de 66 dp (el 61 % central), porque
       cada fabricante recorta el icono con su propia máscara. El fondo es
       @color/ic_launcher_background (#0D1525). -->
  <defs>
    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="40%" stop-color="#7B68EE"/>
      <stop offset="70%" stop-color="#C71585"/>
      <stop offset="100%" stop-color="#FF1493"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#FF1493" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF1493" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(512 512) scale(3.6) translate(-57.5 -47.1)">
    <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 20 L0 55 L20 90" stroke="#00BFFF"/>
      <path d="M15 55 L30 90 L50 50 L70 90 L90 30" stroke="url(#main)"/>
      <path d="M95 20 L115 55 L95 90" stroke="#FF1493"/>
    </g>
    <line x1="70" y1="90" x2="100" y2="10" stroke="url(#main)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="100" cy="10" r="10" fill="url(#dotGlow)" filter="url(#softGlow)"/>
    <circle cx="100" cy="10" r="6" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="100" cy="10" r="3" fill="#FF1493"/>
  </g>
</svg>
