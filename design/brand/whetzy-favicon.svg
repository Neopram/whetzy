<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: el símbolo simplificado para 16-32 px. Sin brillos ni líneas
       de velocidad (a ese tamaño son una mancha) y con trazos más gruesos. -->
  <defs>
    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="45%" stop-color="#7B68EE"/>
      <stop offset="100%" stop-color="#FF1493"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0D1525"/>
  <g transform="translate(32 33) scale(0.4) translate(-57.5 -50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 20 L2 55 L22 90" stroke="#00BFFF" stroke-width="13"/>
    <path d="M18 55 L32 88 L50 52 L68 88 L96 16" stroke="url(#main)" stroke-width="13"/>
    <path d="M93 20 L113 55 L93 90" stroke="#FF1493" stroke-width="13"/>
    <circle cx="98" cy="11" r="10" fill="#FF1493" stroke="none"/>
  </g>
</svg>
