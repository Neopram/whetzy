<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background rounded square — Whetzy sky-blue brand (#1CB0F6 → #0B72B0) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CB0F6"/>
      <stop offset="100%" stop-color="#0B72B0"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Letter W — white, bold, centered -->
  <!-- W drawn as two V shapes side by side, apex at y=700 -->
  <!-- Left V: (192,260) → (312,700) → (432,420) -->
  <!-- Right V: (432,420) → (552,700) → (672,420) → (792,700) → (832,260) -->
  <polyline
    points="192,260 312,700 432,420 552,700 672,420 792,700 832,260"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="108"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
