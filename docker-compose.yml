services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neurium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurium_dev}
      POSTGRES_DB: neurium
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurium"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["bash", "scripts/start.sh"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://neurium:${POSTGRES_PASSWORD:-neurium_dev}@db:5432/neurium
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      CONTENT_DIR: /app/content
    volumes:
      # Mount the content bank so the loader can ingest it on boot.
      - ./content:/app/content:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
