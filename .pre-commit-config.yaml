repos:
  # Detect secrets in commits (gitleaks)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python security linter (bandit) - detects common security issues
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [--severity-level=medium]
        exclude: ^tests/

  # Static analysis (semgrep) - pattern-based security and code quality
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.91.0
    hooks:
      - id: semgrep
        args: [--config=p/security-audit, --json]
        exclude: ^(tests/|\.venv/)

  # Code formatting (ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]
        exclude: ^(\.wrangler/|\.railway/)

ci:
  autofix_commit_msg: |
    chore: fix code formatting

    - ruff: auto-format
  skip:
    # Some tools don't play well in CI environments or are too slow
    - gitleaks
    - semgrep
  autoupdate_branch: ''
  autoupdate_commit_msg: 'chore: pre-commit autoupdate'
  autoupdate_schedule: weekly
