[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --tb=short -m "not benchmark and not slow"
markers =
    benchmark: wall-clock time budget; unreliable on a shared runner, so the normal suite deselects it. Run only these with: python -m pytest -m benchmark
    slow: correctness/memory assertions that are slow by construction (O(corpus) work per assertion, not a flaky timing budget) — the normal suite deselects them so they don't dominate every run's wall-clock. ci_local.sh and ci.yml run them in their own step with a long timeout. Run directly with: python -m pytest -m slow
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
