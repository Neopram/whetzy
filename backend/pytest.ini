[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --tb=short -m "not benchmark"
markers =
    benchmark: wall-clock time budget; unreliable on a shared runner, so the normal suite deselects it. Run only these with: python -m pytest -m benchmark
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
